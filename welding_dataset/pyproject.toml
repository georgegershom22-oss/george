[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "welding-dataset"
version = "0.1.0"
description = "Synthetic dataset generator for ML-driven inverse design of welding parameters"
readme = "README.md"
authors = [{name = "Cursor Agent"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pydantic>=2.7",
]

[project.scripts]
wd-generate = "welding_dataset.scripts.generate_welding_dataset:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["welding_dataset"]
