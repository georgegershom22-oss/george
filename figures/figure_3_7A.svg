rect x="935" y="520" width="75" height="70" fill="#2A9D8F"/><text x="972.5" y="561" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="22">Shear-mediated</text><text x="960" y="610" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="18">∑wi=1</text><text x="510" y="636" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="16">shares guided by §3.2 similarity &amp; §3.4–3.6 scalings</text><line x1="380" y1="184" x2="480" y2="555" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="380" y1="240" x2="480" y2="555" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="380" y1="296" x2="480" y2="555" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="380" y1="352" x2="480" y2="555" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="380" y1="408" x2="480" y2="555" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/><path d="M 730 790 C 750 766, 770 766, 790 790 C 770 814, 750 814, 730 790" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="760" y="838" text-anchor="middle" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="22">Composite attenuation</text><line x1="760" y1="720" x2="760" y2="764" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="1160" y="470" width="360" height="420" rx="14" ry="14" fill="none" stroke="#111827" stroke-width="2.5"/><text x="1176" y="460" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Predicted / measured outputs</text><path d="M 1190 526 C 1280 502, 1340 544, 1460 516" stroke="#111827" stroke-width="2.5" fill="none"/><text x="1190" y="512" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="22">TL(ω)</text><path d="M 1190 616 C 1280 596, 1350 646, 1460 610" stroke="#111827" stroke-width="2.5" fill="none"/><circle cx="1340" cy="626" r="6" fill="#111827"/><text x="1190" y="602" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="22">γ²(ω)</text><path d="M 1200 736 Q 1230 696, 1260 736" stroke="#111827" stroke-width="2.5" fill="none"/><path d="M 1340 736 Q 1390 690, 1440 736" stroke="#111827" stroke-width="2.5" fill="none"/><text x="1190" y="692" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="22">PSD(ω) width</text><line x1="1340" y1="890" x2="1340" y2="950" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/><text x="1340" y="976" text-anchor="middle" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="18">Design implications: Choose ω, θ, Ri, kδ to target mechanisms; update priors with data.</text><path d="M 1040 590 C 1240 490, 1080 930, 760 740" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="2 6" fill="none" marker-end="url(#arrowColored)"/><text x="1050" y="582" text-anchor="start" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="18">priors</text><path d="M 760 740 C 660 800, 1160 920, 1520 900" stroke="#111827" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1516" y="894" text-anchor="end" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="18">posterior (with data)</text><rect x="1580" y="1268" width="28" height="12" fill="#6B7280" rx="2" ry="2"/><text x="1616" y="1278" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="16" dominant-baseline="ideographic">Classical</text><rect x="1580" y="1294" width="28" height="12" fill="#F4A261" rx="2" ry="2"/><text x="1616" y="1304" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="16" dominant-baseline="ideographic">Mode conversion</text><rect x="1580" y="1320" width="28" height="12" fill="#6A4C93" rx="2" ry="2"/><text x="1616" y="1330" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="16" dominant-baseline="ideographic">Interfacial</text><rect x="1580" y="1346" width="28" height="12" fill="#2A9D8F" rx="2" ry="2"/><text x="1616" y="1356" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="16" dominant-baseline="ideographic">Shear-mediated</text><text x="1000" y="1370" fill="#111827" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" text-anchor="middle">Figure 3.7A. Composite attenuation concept. Similarity variables feed a mechanism-weighting module that yields shares summing to unity; these combine into a composite prediction of attenuation and observables used to set priors and design experiments.</text></svg>